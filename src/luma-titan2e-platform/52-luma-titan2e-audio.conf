# Titan 2 Elite (ALSA card Titan2Elite): media goes to the speaker, the
# earpiece is for calls, and idle nodes suspend so the speaker amplifier
# powers down.
monitor.alsa.rules = [
  {
    matches = [
      { alsa.card_name = "Titan2Elite" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 5
      }
    }
  }
  {
    matches = [
      { alsa.card_name = "Titan2Elite", node.name = "~alsa_output.*HiFi__Earpiece__sink" }
    ]
    actions = {
      update-props = {
        priority.driver = 500
        priority.session = 500
      }
    }
  }
]
