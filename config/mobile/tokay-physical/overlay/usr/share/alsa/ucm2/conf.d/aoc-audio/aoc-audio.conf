# Tokay native capture and calibrated, bounded quiet speaker route.
# Normal playback gain and sustained loudness remain unqualified.
Syntax 6
Comment "Pixel 9 built-in audio"
SectionUseCase."HiFi" {
 File "/Luma/Tokay/HiFi.conf"
 Comment "Built-in audio"
}
FixedBootSequence [
 cset "name='Digital PCM Volume' 0"
 cset "name='R Digital PCM Volume' 0"
]
