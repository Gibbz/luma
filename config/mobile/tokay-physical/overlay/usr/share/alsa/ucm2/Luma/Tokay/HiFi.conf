# Derived from the exact factory mixer_paths.xml microphones (VOICE)
# gain controls and the native aoc-audio capture endpoint. No Android service.
SectionVerb {
 EnableSequence []
 DisableSequence []
 Value { TQ "HiFi" }
}
SectionDevice."Mic" {
 Comment "Built-in microphones"
 EnableSequence [
  cset "name='Mic HW Gain (cB)' 130"
  cset "name='Mic Record Soft Gain (dB)' 0"
 ]
 DisableSequence [
  cset "name='Mic HW Gain (cB)' 0"
  cset "name='Mic Record Soft Gain (dB)' 0"
 ]
 Value {
  CapturePriority 100
  CapturePCM "hw:${CardId},1"
  CaptureChannels 2
 }
}

# Bounded native playback: calibrated protection, -18 dB digital, 0.5 dB analog.
SectionDevice."Speaker" {
 Comment "Built-in speakers"
 EnableSequence [
  exec "/usr/libexec/luma-tokay-speaker-ready"
  cset "name='Analog PCM Volume' 0"
  cset "name='R Analog PCM Volume' 0"
  cset "name='Digital PCM Volume' 673"
  cset "name='R Digital PCM Volume' 673"
 ]
 DisableSequence [
  cset "name='Digital PCM Volume' 0"
  cset "name='R Digital PCM Volume' 0"
 ]
 Value {
  PlaybackPriority 100
  PlaybackPCM "hw:${CardId},0"
  PlaybackChannels 2
 }
}
